name: CPU correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python benchmark.py --numpy-only --sizes 1000 10000 --repeats 3 --warmup 1
      - run: python plot_results.py results/latest/summary.csv
