name: CPU correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-zarr.txt
      - run: python -m unittest discover -s tests -v
      - run: python benchmark.py --numpy-only --sizes 1000 10000 --repeats 3 --warmup 1
      - run: python plot_results.py results/latest/summary.csv
      - run: python weather_verify.py --forecast data/weather_demo/manufactured_forecast.nc --reference data/weather_demo/reference.nc --backend numpy --repeats 3 --warmup 1 --output results/latest/weather_ci
      - run: python scripts/analyze_weather.py results/latest/weather_ci
      - run: python weather_verify.py --forecast data/gfs_taiwan_pair/forecast.nc --reference data/gfs_taiwan_pair/reference.nc --backend numpy --repeats 3 --warmup 1 --output results/latest/gfs_ci
      - run: python scripts/analyze_weather.py results/latest/gfs_ci --forecast data/gfs_taiwan_pair/forecast.nc --reference data/gfs_taiwan_pair/reference.nc
      - run: python weather_verify.py --forecast data/ecmwf_zarr_pair/forecast.zarr --reference data/ecmwf_zarr_pair/reference.zarr --backend numpy --repeats 3 --warmup 1 --output results/latest/zarr_ci
      - run: python scripts/analyze_weather.py results/latest/zarr_ci --forecast data/ecmwf_zarr_pair/forecast.zarr --reference data/ecmwf_zarr_pair/reference.zarr
      - run: python weather_batch.py --backend numpy --cases control_small ensemble_small --repeats 3 --warmup 1 --output results/latest/batch_ci
      - run: python scripts/analyze_weather_batch.py results/latest/batch_ci --output results/latest/batch_ci_report
      - run: python weather_pipeline.py --backend numpy --case control_small --repeats 3 --warmup 1 --profile-repeats 2 --output results/latest/pipeline_ci
      - run: python scripts/analyze_pipeline.py results/latest/pipeline_ci --output results/latest/pipeline_ci_report
      - run: python weather_stability.py --backend numpy --case control_small --repeats 4 --warmup 1 --output results/latest/stability_ci
      - run: python scripts/analyze_stability.py results/latest/stability_ci --output results/latest/stability_ci_report
      - run: python scripts/analyze_dispatch.py results/rtx3050_dispatch_run01 results/rtx3050_dispatch_run02 --output results/latest/dispatch_ci
      - run: python scripts/analyze_physicsnemo.py results/rtx3050_physicsnemo_run01 results/rtx3050_physicsnemo_run02 --output results/latest/physicsnemo_ci
      - run: python scripts/analyze_physicsnemo_pipeline.py results/rtx3050_physics_pipeline_run01 results/rtx3050_physics_pipeline_run02 --output results/latest/physicsnemo_pipeline_ci
      - run: python scripts/analyze_physicsnemo_pipeline.py results/rtx3050_physics_pipeline_b16_check --output results/latest/physicsnemo_pipeline_b16_ci
      - run: python scripts/analyze_physicsnemo_reuse.py results/rtx3050_physics_reuse_run01 results/rtx3050_physics_reuse_run02 --output results/latest/physicsnemo_reuse_ci
      - run: python scripts/analyze_physicsnemo_schedule.py results/rtx3050_physics_schedule_run01 results/rtx3050_physics_schedule_run02 --output results/latest/physicsnemo_schedule_ci
      - run: python scripts/analyze_physicsnemo_graph.py results/rtx3050_physics_graph_run01 results/rtx3050_physics_graph_run02 --output results/latest/physicsnemo_graph_ci
      - run: python scripts/analyze_physicsnemo_graph_pipeline.py results/rtx3050_physics_graph_pipeline_run01 results/rtx3050_physics_graph_pipeline_run02 --output results/latest/physicsnemo_graph_pipeline_ci
      - run: python scripts/analyze_physicsnemo_reader.py results/rtx3050_physics_reader_pipeline_run01 results/rtx3050_physics_reader_pipeline_run02 --reader-runs results/rtx3050_physics_reader_run01 results/rtx3050_physics_reader_run02 --output results/latest/physicsnemo_reader_ci
      - run: python scripts/analyze_physicsnemo_gather.py results/rtx3050_physics_gather_pipeline_run01 results/rtx3050_physics_gather_pipeline_run02 --reader-runs results/rtx3050_physics_gather_run01 results/rtx3050_physics_gather_run02 --output results/latest/physicsnemo_gather_ci
      - run: python scripts/analyze_physicsnemo_nsight.py results/rtx3050_physics_nsight_run01 results/rtx3050_physics_nsight_run02 results/rtx3050_physics_nsight_run03 --output results/latest/physicsnemo_nsight_ci
